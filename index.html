<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cifradores – Permutación de Grupos & Vernam</title>
  <meta name="description" content="Implementación de los algoritmos de cifrado Permutación de Grupos y Vernam." />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <header>
    <h1>Cifradores Clásicos</h1>
    <p class="subtitle">Permutación de Grupos &middot; Vernam</p>
  </header>

  <main class="card">

    <div class="tabs" role="tablist">
      <div class="tab active" id="tab-perm" role="tab" onclick="switchAlgo('permutation')">
        Permutación de Grupos
        <span class="tab-badge">TRANS</span>
      </div>
      <div class="tab" id="tab-vern" role="tab" onclick="switchAlgo('vernam')">
        Vernam
        <span class="tab-badge">XOR</span>
      </div>
    </div>

    <div class="card-body">

      <div class="mode-row">
        <span class="mode-label">Modo:</span>
        <div class="toggle-group">
          <button class="toggle-btn active" id="btn-encrypt" onclick="setMode('encrypt')">Cifrar</button>
          <button class="toggle-btn" id="btn-decrypt" onclick="setMode('decrypt')">Descifrar</button>
        </div>
      </div>

      <div class="form-group">
        <label for="input-msg">Mensaje de entrada</label>
        <textarea id="input-msg" placeholder="Escribe aquí el mensaje..."></textarea>
      </div>

      <div class="form-group">
        <label for="input-key">
          Clave
          <span class="hint" id="key-hint"></span>
        </label>
        <input type="text" id="input-key" placeholder="" />
      </div>

      <div class="actions">
        <button class="btn btn-primary" onclick="runCipher()">Procesar</button>
        <button class="btn btn-secondary" onclick="clearAll()">Limpiar</button>
      </div>

      <div class="output-header">
        <label style="margin:0">Resultado</label>
        <button class="copy-btn" onclick="copyOutput()">Copiar</button>
      </div>
      <div class="output-box empty" id="output-box">
        El resultado aparecerá aquí...
      </div>

      <div class="error-msg" id="error-msg"></div>

      <details class="steps-section" id="steps-section">
        <summary class="steps-title">
          <span class="steps-title-text">
            <span class="steps-arrow">▶</span>
            <span>Pasos del proceso</span>
            <span class="steps-count" id="steps-count"></span>
          </span>
          <span class="steps-toggle-label">Desplegar</span>
        </summary>
        <div id="steps-list"></div>
      </details>


    </div>
  </main>

  <footer>
    <p>SC-TIF3.2 &mdash; Seguridad en Computación</p>
  </footer>

  <script src="js/utils.js"></script>
  <script src="js/permutation.js"></script>
  <script src="js/vernam.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>

</body>

</html>
